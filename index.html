<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Football AI</title><link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#07110d;color:#fff;font-family:Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;background:#0b1712}
header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #1b382b}
.logo{font-size:23px;font-weight:bold;color:#35e58a}.coin{background:#162b22;padding:9px 13px;border-radius:20px;color:#ffd65a}
main{padding:20px}.hero{padding:25px 0}.hero h1{font-size:32px;margin:5px 0}.muted{color:#91a59c}
.card{background:#10231b;border:1px solid #1d3b2f;border-radius:18px;padding:18px;margin:14px 0}
.match{display:flex;align-items:center;justify-content:space-between;text-align:center}.team{width:40%;font-weight:bold}.vs{color:#35e58a;font-weight:bold}
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#35df86;color:#03130b;font-weight:bold;margin-top:12px;font-size:15px}
.tag{display:inline-block;background:#17382b;color:#6af0a5;padding:5px 9px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">⚽ Football AI</div>
<div class="coin">🪙 10</div>
</header>

<main>
<div class="hero">
<span class="tag">AI FOOTBALL ANALYSIS</span>
<h1>Understand the game.</h1>
<p class="muted">Smarter analysis. Better decisions.</p>
</div>

<div class="card">
<span class="tag">TODAY</span>
<h2>🔥 Featured Match</h2>

<div class="match">
<div class="team">🔴<br>Arsenal</div>
<div class="vs">VS</div>
<div class="team">🔵<br>Chelsea</div>
</div>

<button class="btn">View Match</button>
</div>

<div class="card">
<h2>🤖 AI Analysis</h2>
<p class="muted">
Get estimated winner, probabilities, possible score and key factors.
</p>
<button class="btn">Start Analysis</button>
</div>
</main>
</div>
</body>
</html>
