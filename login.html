<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Football AI</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-logo .logo-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .auth-logo h1 {
      color: #35e58a;
      font-size: 28px;
      margin: 0;
    }

    .auth-logo p {
      color: #91a59c;
      margin-top: 8px;
      font-size: 14px;
    }

    .auth-card {
      background: #10231b;
      border: 1px solid #1d3b2f;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .auth-card h2 {
      margin-bottom: 7px;
      font-size: 23px;
    }

    .auth-subtitle {
      color: #91a59c;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      color: #d8e7df;
      font-size: 13px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #28503e;
      border-radius: 12px;
      background: #0b1712;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #35e58a;
      box-shadow: 0 0 0 2px rgba(53, 229, 138, 0.08);
    }

    .forgot-row {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 14px;
    }

    .text-link {
      color: #58eca0;
      text-decoration: none;
      font-size: 13px;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 4px;
    }

    .login-btn {
      background: #35df86;
      color: #03130b;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #6f8479;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #234235;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0b1712;
      color: #fff;
      border: 1px solid #28503e;
    }

    .google-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #4285f4;
      font-size: 13px;
      font-weight: 800;
    }

    .phone-icon {
      font-size: 18px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #91a59c;
      font-size: 13px;
    }

    .security-note {
      margin-top: 16px;
      text-align: center;
      color: #6f8479;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      .auth-page {
        padding: 15px;
      }

      .auth-card {
        padding: 18px;
      }

      .auth-logo h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="auth-page">

      <div class="auth-box">

        <div class="auth-logo">
          <div class="logo-icon">⚽</div>
          <h1>Football AI</h1>
          <p>Smarter Analysis. Better Decisions.</p>
        </div>

        <div class="auth-card">

          <h2>Welcome Back</h2>
          <p class="auth-subtitle">Login to continue to Football AI.</p>

          <form>

            <div class="input-group">
              <label for="emailPhone">Email or Phone</label>
              <input
                type="text"
                id="emailPhone"
                name="emailPhone"
                placeholder="Enter email or phone"
                autocomplete="username"
              >
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
              >
            </div>

            <div class="forgot-row">
              <a href="forgot-password.html" class="text-link">
                Forgot Password?
              </a>
            </div>

            <button type="submit" class="auth-btn login-btn">
              Login
            </button>

          </form>

          <div class="divider">
            OR
          </div>

          <button type="button" class="social-btn">
            <span class="google-icon">G</span>
            Continue with Google
          </button>

          <button type="button" class="social-btn">
            <span class="phone-icon">📱</span>
            Continue with Phone
          </button>

          <div class="auth-footer">
            Don't have an account?
            <a href="register.html" class="text-link">Create Account</a>
          </div>

          <div class="security-note">
            Secure authentication will be connected to the backend.
          </div>

        </div>

      </div>

    </div>
  </div>

</body>
</html>
