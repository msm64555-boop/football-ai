<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Football AI</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-logo .logo-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .auth-logo h1 {
      color: #35e58a;
      font-size: 28px;
      margin: 0;
    }

    .auth-logo p {
      color: #91a59c;
      margin-top: 8px;
      font-size: 14px;
    }

    .auth-card {
      background: #10231b;
      border: 1px solid #1d3b2f;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .auth-card h2 {
      margin-bottom: 7px;
      font-size: 23px;
    }

    .auth-subtitle {
      color: #91a59c;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      color: #d8e7df;
      font-size: 13px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #28503e;
      border-radius: 12px;
      background: #0b1712;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #35e58a;
      box-shadow: 0 0 0 2px rgba(53, 229, 138, 0.08);
    }

    .forgot-row {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 14px;
    }

    .text-link {
      color: #58eca0;
      text-decoration: none;
      font-size: 13px;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 4px;
      cursor: pointer;
    }

    .login-btn {
      background: #35df86;
      color: #03130b;
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #6f8479;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #234235;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0b1712;
      color: #fff;
      border: 1px solid #28503e;
      cursor: pointer;
    }

    .google-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #4285f4;
      font-size: 13px;
      font-weight: 800;
    }

    .phone-icon {
      font-size: 18px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #91a59c;
      font-size: 13px;
    }

    .security-note {
      margin-top: 16px;
      text-align: center;
      color: #6f8479;
      font-size: 11px;
      line-height: 1.5;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: rgba(255, 80, 80, 0.10);
      border: 1px solid rgba(255, 100, 100, 0.28);
      color: #ffb0b0;
    }

    .message.success {
      display: block;
      background: rgba(53, 229, 138, 0.10);
      border: 1px solid rgba(53, 229, 138, 0.25);
      color: #8ff0bb;
    }

    @media (max-width: 360px) {
      .auth-page {
        padding: 15px;
      }

      .auth-card {
        padding: 18px;
      }

      .auth-logo h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="auth-page">

      <div class="auth-box">

        <div class="auth-logo">
          <div class="logo-icon">⚽</div>
          <h1>Football AI</h1>
          <p>Smarter Analysis. Better Decisions.</p>
        </div>

        <div class="auth-card">

          <h2>Welcome Back</h2>
          <p class="auth-subtitle">Login to continue to Football AI.</p>

          <div id="message" class="message"></div>

          <form id="loginForm">

            <div class="input-group">
              <label for="emailPhone">Email or Phone</label>
              <input
                type="text"
                id="emailPhone"
                name="emailPhone"
                placeholder="Enter email or phone"
                autocomplete="username"
                required
              >
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              >
            </div>

            <div class="forgot-row">
              <a href="forgot-password.html" class="text-link">
                Forgot Password?
              </a>
            </div>

            <button
              type="submit"
              id="loginButton"
              class="auth-btn login-btn"
            >
              Login
            </button>

          </form>

          <div class="divider">
            OR
          </div>

          <button
            type="button"
            id="googleButton"
            class="social-btn"
          >
            <span class="google-icon">G</span>
            Continue with Google
          </button>

          <button
            type="button"
            id="phoneButton"
            class="social-btn"
          >
            <span class="phone-icon">📱</span>
            Continue with Phone
          </button>

          <div class="auth-footer">
            Don't have an account?
            <a href="register.html" class="text-link">Create Account</a>
          </div>

          <div class="security-note">
            Secure authentication is powered by Supabase.
          </div>

        </div>

      </div>

    </div>
  </div>


  <!-- Supabase JavaScript v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*
      FOOTBALL AI - SUPABASE CONFIG
      --------------------------------
      Supabase Project URL:
      https://ymuigmyxjpjmwmqlvuef.supabase.co

      IMPORTANT:
      Put your Supabase PUBLISHABLE key below.
      Do NOT put a secret/service_role key here.
    */

    const SUPABASE_URL =
      "https://ymuigmyxjpjmwmqlvuef.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_eTmE9vVtTy_SLU9urgHTSg_nlJhep57";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    const googleButton = document.getElementById("googleButton");
    const phoneButton = document.getElementById("phoneButton");


    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }


    function getRedirectUrl() {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect");

      if (redirect) {
        return redirect;
      }

      return "index.html";
    }


    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }


    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      const emailPhone =
        document.getElementById("emailPhone").value.trim();

      const password =
        document.getElementById("password").value;


      if (!emailPhone || !password) {
        showMessage(
          "Please enter your email/phone and password.",
          "error"
        );
        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      messageBox.className = "message";


      try {

        let authData = null;


        if (isValidEmail(emailPhone)) {

          const result =
            await supabaseClient.auth.signInWithPassword({
              email: emailPhone,
              password: password
            });

          authData = result;

        } else {

          const result =
            await supabaseClient.auth.signInWithPassword({
              phone: emailPhone,
              password: password
            });

          authData = result;
        }


        if (authData.error) {
          throw authData.error;
        }


        if (!authData.data || !authData.data.session) {
          throw new Error(
            "Login completed, but no active session was returned."
          );
        }


        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        setTimeout(function () {

          const redirectUrl = getRedirectUrl();

          window.location.href = redirectUrl;

        }, 500);


      } catch (error) {

        console.error("Login error:", error);

        let errorMessage =
          "Login failed. Please check your details and try again.";


        if (error && error.message) {

          const msg =
            error.message.toLowerCase();


          if (
            msg.includes("invalid login credentials")
          ) {
            errorMessage =
              "Invalid email/phone or password.";
          }

          else if (
            msg.includes("email not confirmed")
          ) {
            errorMessage =
              "Please confirm your email before logging in.";
          }

          else if (
            msg.includes("phone not confirmed")
          ) {
            errorMessage =
              "Please verify your phone number first.";
          }

          else if (
            msg.includes("rate limit")
          ) {
            errorMessage =
              "Too many attempts. Please wait a little and try again.";
          }

          else {
            errorMessage = error.message;
          }
        }


        showMessage(errorMessage, "error");


      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    });


    /*
      Google and Phone buttons are intentionally not fake.
      They will be connected after their Supabase providers/settings
      are configured.
    */

    googleButton.addEventListener("click", function () {

      showMessage(
        "Google Login will be enabled after Google provider setup.",
        "error"
      );

    });


    phoneButton.addEventListener("click", function () {

      showMessage(
        "Phone Login will be enabled after phone authentication setup.",
        "error"
      );

    });


    /*
      If the user is already logged in,
      don't show the login page again.
    */

    async function checkExistingSession() {

      try {

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          console.error("Session check error:", error);
          return;
        }

        if (data && data.session) {

          window.location.href =
            getRedirectUrl();

        }

      } catch (error) {

        console.error(
          "Unexpected session error:",
          error
        );

      }

    }


    checkExistingSession();

  </script>

</body>
</html>
